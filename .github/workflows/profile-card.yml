# Refreshes the neofetch-style profile card (`dark_mode.svg` / `light_mode.svg`)
# and Pac-Man contribution board (`pacman_dark.svg` / `pacman_light.svg`).
#
# `tools/fetch_stats.py` queries the GitHub GraphQL API into a transient,
# gitignored `cache/` directory on the runner; `build_card.py` and
# `build_pacman.py` then regenerate only the committed `*.svg` outputs.
name: Update Profile Card

on:
  # Refresh stats and contribution board once a day.
  schedule:
    - cron: "0 5 * * *"

  workflow_dispatch:

  # Rebuild immediately when ASCII art, generator scripts, or workflow change.
  push:
    branches: [main]
    paths:
      - "assets/**"
      - "tools/**"
      - ".github/workflows/profile-card.yml"

permissions:
  contents: write

concurrency:
  group: profile-card
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@v4
        with:
          # Rebasing below needs a real merge base, which a shallow clone lacks.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch GitHub stats
        env:
          # A PAT with `read:user` is needed for private contribution counts;
          # without it the built-in `GITHUB_TOKEN` covers all public figures.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python tools/fetch_stats.py

      - name: Rebuild the card
        run: python tools/build_card.py

      - name: Rebuild the Pac-Man board
        run: python tools/build_pacman.py

      - name: Rebuild the link buttons
        run: python tools/build_links.py

      - name: Rebase onto any commits that landed meanwhile
        run: git pull --rebase --autostash origin main

      - name: Commit the regenerated card
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile card stats"
          branch: main
          file_pattern: "*.svg"
